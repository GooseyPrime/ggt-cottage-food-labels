version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm_and_yarn:
        patterns: ["*"]
    ignore:
      # Major bumps of the test toolchain have broken the Vercel build; take them by hand.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
